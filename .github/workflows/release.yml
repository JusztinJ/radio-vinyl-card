name: Release

# Push a tag like v1.0.1 and this creates the GitHub release with the card attached,
# which is what HACS uses for versions and updates.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check card version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "CARD_VERSION = \"$TAG\"" radio-vinyl-card.js || { echo "::error::CARD_VERSION in radio-vinyl-card.js is not $TAG"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" radio-vinyl-card.js \
            --title "$GITHUB_REF_NAME" --generate-notes
