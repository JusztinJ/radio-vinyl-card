name: Release

# Publish a release (or push a tag like v1.0.1) and this attaches radio-vinyl-card.js
# to it, which is what HACS uses for versions and updates.
on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Attach card to release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check card version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "CARD_VERSION = \"$TAG\"" radio-vinyl-card.js || { echo "::error::CARD_VERSION in radio-vinyl-card.js is not $TAG"; exit 1; }
      - name: Create release or attach file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" radio-vinyl-card.js --clobber
          else
            gh release create "$GITHUB_REF_NAME" radio-vinyl-card.js --title "$GITHUB_REF_NAME" --generate-notes
          fi
